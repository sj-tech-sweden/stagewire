server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Runtime-injected config (API base URL). Never cache: a Pod restart
  # may supply a new value.
  location = /env-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
  }

  # SPA history-mode fallback: unknown paths serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
