name: Docker Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "api-v*"
      - "web-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile
            image: stagewire-backend
          - service: web
            dockerfile: web/Dockerfile
            image: stagewire-frontend
            target: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: |
            ghcr.io/sj-tech-sweden/${{ matrix.image }}:latest
            ghcr.io/sj-tech-sweden/${{ matrix.image }}:${{ github.sha }}
