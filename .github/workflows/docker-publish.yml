name: Docker Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: api
            dockerfile: api/Dockerfile
            image: stagewire-backend
            target: production
          - service: web
            context: web
            dockerfile: web/Dockerfile
            image: stagewire-frontend
            target: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/sj-tech-sweden/${{ matrix.image }}:latest
            ghcr.io/sj-tech-sweden/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/sj-tech-sweden/${{ matrix.image }}:${{ github.ref_name }}
