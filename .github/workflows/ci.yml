name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stagewire
          POSTGRES_PASSWORD: stagewire
          POSTGRES_DB: stagewire_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stagewire -d stagewire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://stagewire:stagewire@localhost:5433/stagewire_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check app tests
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if python -c "import socket; socket.create_connection(('localhost', 5433), timeout=1)" 2>/dev/null; then
              echo "Postgres is reachable"; exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become reachable"; exit 1
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run e2e

